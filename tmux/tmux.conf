# =============================================================================
# tmux config — optimized for Claude Code Agent Teams + Neovim
# =============================================================================

# Change prefix from Ctrl+b to Ctrl+t (frees Ctrl+a for vim)
unbind C-b
set -g prefix C-t
bind C-t send-prefix

# =============================================================================
# Core settings
# =============================================================================

# True color support (required for Neovim themes)
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Mouse: click to focus panes, resize, scroll
set -g mouse on

# Start windows and panes at 1 (not 0)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Faster key repetition
set -s escape-time 0

# Extended keys — lets tmux distinguish Shift+Enter from Enter, etc.
set -s extended-keys on

# Prevent CLAUDECODE env var from leaking into new shells
# (avoids "cannot launch inside another session" error)
set-environment -gr CLAUDECODE

# Increase scrollback buffer
set -g history-limit 50000

# =============================================================================
# Splits & windows
# =============================================================================

# Intuitive splits (| = vertical, - = horizontal), keep current path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window keeps current path
bind c new-window -c "#{pane_current_path}"

# Swap window left/right
bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1

# =============================================================================
# Pane navigation — Vim-style (works alongside claudecode.nvim)
# =============================================================================

# Smart pane switching: vim-aware (won't steal hjkl from nvim)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind -n C-h select-pane -L
bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
unbind -n C-l

# Pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# =============================================================================
# Status bar
# =============================================================================

set -g status-position bottom
set -g status-style 'bg=#1e1e2e fg=#cdd6f4'
# Track last session for status line display
set -g @last-session ""
set -g @_prev_session ""
set-hook -g client-session-changed 'run-shell "~/.config/tmux/track-session.sh"'

set -g status-left '#[bg=#89b4fa,fg=#1e1e2e,bold] #S #[default] '
set -g status-left-length 30
set -g status-right '#{?#{==:#{@last-session},},, #[fg=#629f56]<C-t> tab: #{@last-session} }'
set -g status-right-length 60

# Window tabs
set -g window-status-format ' #I:#W '
set -g window-status-current-format '#[bg=#313244,fg=#cdd6f4,bold] #I:#W '

# Pane border
set -g pane-border-style 'fg=#313244'
set -g pane-active-border-style 'fg=#89b4fa'

# =============================================================================
# Session switching (no shift key needed)
# =============================================================================
bind -r [ switch-client -p
bind -r ] switch-client -n
bind tab switch-client -l
bind s choose-tree -sZ -O name
bind f display-popup -E -w 60% -h 40% "tmux list-sessions -F '#S' | fzf --reverse --prompt='session> ' | xargs -r tmux switch-client -t"
bind v copy-mode

# Open/attach a session from a ~/dev folder (sessionizer)
bind o display-popup -E -w 60% -h 40% "~/.config/tmux/sessionizer.sh"
# Kill the current session, then switch to the 1st session (first by name)
bind X confirm-before -p "kill session '#S'? (y/n)" "run-shell '~/.config/tmux/kill-session.sh \"#S\"'"

# =============================================================================
# Navi cheatsheet widget — runs locally, pastes into active pane (works over SSH)
# =============================================================================
bind C-n display-popup -E -w 80% -h 60% "navi --print | tmux load-buffer -b tmp - && tmux paste-buffer -p -t {last} -b tmp -d"

# =============================================================================
# Reload config
# =============================================================================
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Pass Ctrl+a through to the shell/vim (beginning of line)
bind -n C-a send-keys C-a

# tmux-resurrect — remap to avoid conflict with built-in Ctrl+s (session list)
set -g @resurrect-save 'S'
set -g @resurrect-restore 'R'
run-shell ~/.tmux/plugins/tmux-sensible/sensible.tmux
run-shell ~/.tmux/plugins/tmux-resurrect/resurrect.tmux
